<ion-header>
  <ion-toolbar style="--background: #0f0f0f;">
    <ion-buttons slot="start">
      <ion-back-button style="color: white;" defaultHref="/my-profile"></ion-back-button>
    </ion-buttons>
    <ion-title>
      <img src="../../assets/Kia White Logo (no BG).png" style="width: 33%; margin-left: 25%;">
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="background-image" fullscreen="true">
  <!-- <div style="width: 100%; height: 3px; background: rgb(235, 0, 41);" slot="fixed"></div> -->

  <div *ngIf="kiaProviderService.vehicle_id!=''" style="text-align: -webkit-center;">
    <h2>Update vehicle</h2>
    <form [formGroup]="signup" (ngSubmit)="updateNumber()">
      <div class="input-wrapper">
        <ion-grid>
          <ion-row>
            <ion-col style="text-align: -webkit-right;">
              <ion-item class="input-style">
                <ion-input type="text" #vehicleAddFirst maxlength="3" style='text-transform: uppercase; text-align: center; font-weight: bold;' placeholder="AAA" formControlName="vehicleNumberFirst" (keyup)="controllerFirst()"></ion-input>
              </ion-item>
            </ion-col>
            <ion-col style="text-align: -webkit-left;">
              <ion-item class="input-style">
                <ion-input type="tel" #vehicleAddLast maxlength="4" style='text-transform: uppercase; text-align: left; font-weight: bold;' placeholder="1234" formControlName="vehicleNumberLast" (keyup)="controllerLast()"></ion-input>
              </ion-item>
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col size="12">
              <div class="validation-errors">
                <ng-container *ngFor="let validation of validation_messages.vehicleNumberFirst">
                  <div class="error-message"
                    *ngIf="signup.get('vehicleNumberFirst').hasError(validation.type) && (signup.get('vehicleNumberFirst').dirty || signup.get('vehicleNumberFirst').touched)">
                    {{ validation.message }}
                  </div>
                </ng-container>
              </div>
              <div class="validation-errors">
                <ng-container *ngFor="let validation of validation_messages.vehicleNumberLast">
                  <div class="error-message"
                    *ngIf="signup.get('vehicleNumberLast').hasError(validation.type) && (signup.get('vehicleNumberLast').dirty || signup.get('vehicleNumberLast').touched)">
                    {{ validation.message }}
                  </div>
                </ng-container>
              </div>
            </ion-col>
          </ion-row>
        </ion-grid>
      </div>
      <ion-button type="submit" [disabled]="!signup.valid" class="btnNavigate">Update</ion-button>
    </form>
  </div>
