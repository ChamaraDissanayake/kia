<ion-header>
  <ion-toolbar style="--background: #0f0f0f;">
    <ion-buttons slot="start">
      <ion-back-button style="color: white;" defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>
      <img src="../../assets/Kia White Logo (no BG).png" style="width: 33%; margin-left: 25%;">
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="background-image vertical-center" style="text-align: -webkit-center;" fullscreen="true">
  <!-- <div style="width: 100%; height: 3px; background: rgb(235, 0, 41);" slot="fixed"></div> -->

  <div *ngFor="let item of showroom" class="showroomItem text-white">
    <ion-label>{{item.shop_name}}</ion-label><br>
    <ion-label style="white-space: pre-line;">{{item.shop_address}}</ion-label><br>
    <ion-label>{{item.tel_no}}</ion-label><br>
    <ion-button (click)="gotoLocationView(item.shop_id)" class="btn-view">View</ion-button>
  </div>
</ion-content>
