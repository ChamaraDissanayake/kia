<ion-header>
  <ion-toolbar style="--background: #0f0f0f; border-bottom: 3px solid white;">
    <ion-buttons slot="start">
      <ion-back-button style="color: white;" defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>
      <img src="../../assets/Kia White Logo (no BG).png" style="width: 33%; margin-left: 25%;">
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="background-image vertical-center" fullscreen="true">
  <!-- <div style="width: 100%; height: 3px; background: rgb(235, 0, 41);" slot="fixed"></div> -->

  <div style="text-align: -webkit-center; margin-top: 15%; margin-bottom: 20px;">
    <label class="topics" style="margin-bottom: 10px;">Select service center</label>
    <ion-item class="selector-wrapper">
      <ion-select placeholder="Service center" okText="Confirm" cancelText="Dismiss"
        (ionChange)="selectShowroom($event)">
        <ion-select-option *ngFor="let item of serviceCenters" value="{{item.shop_id}}">{{item.shop_name}}
        </ion-select-option>
      </ion-select>
    </ion-item>
  </div>

  <div style="min-height: 40%;" *ngIf="showroomId!=''">
    <div style="text-align:center">
      <label class="topics">Service center name</label><br>
      <label class="content">{{showroomName}}</label>
    </div>
    <div style="text-align:center; margin-top:10px;">
      <label class="topics">Service center address</label><br>
      <div *ngFor="let item of showroomAddressSplitted; let i = index" style="height: 18px;">
        <label class="content">{{item}}</label>
        <label class="content" *ngIf="showroomAddressSplitted.length>i+1">,</label>
      </div>
    </div>
    <div style="text-align:center; margin-top:10px;">
      <label class="topics">Opening hours</label><br>
      <label class="content">{{showRoomOpenHours}}</label>
    </div>
    <div style="text-align: -webkit-center; margin-bottom: 20px; margin-top:10px;" *ngIf="supervisors.length>0">
      <label class="topics" style="margin-bottom: 10px;">Select service advisor</label>
      <ion-item class="selector-wrapper" style="width: fit-content;">
        <ion-select placeholder="Name" okText="Confirm" cancelText="Dismiss"
          (ionChange)="selectSupervisor($event)">
          <ion-select-option *ngFor="let item of supervisors" value="{{item.supervisor_id}},{{item.supervisor_name}}">
            {{item.supervisor_name}}
          </ion-select-option>
        </ion-select>
      </ion-item>
    </div>
  </div>

  <div style="margin-top: 34px; text-align: center; width: 100%;">
    <ion-button class="btnNavigate" [disabled]='!isValid' (click)="gotoCalendar()" style="margin-right: 40px;">Next
    </ion-button>
    <ion-button class="btnNavigate" [routerLink]="['/home']">Cancel</ion-button>
  </div>

  <ion-grid class="booking-container" *ngFor="let itemlist of pricing">
    <ion-row>
      <div style="width: -webkit-fill-available;">
        <ion-label>{{itemlist.name}}</ion-label>
      </div>
    </ion-row>
    <ion-row>
      <div style="width: -webkit-fill-available;">
        <ion-label>{{itemlist.description}}</ion-label>
      </div>
    </ion-row>
    <ion-row>
      <div style="width: -webkit-fill-available;">
        <ion-label>Standard services</ion-label>
      </div>
    </ion-row>
    <!-- <ion-row>
      <ion-col size = '6'>
        {{item.distance_location}}
      </ion-col>
      <ion-col size = '3' style="border-left: 1px solid white; border-right: 1px solid white;;">
        {{item.one_way}}
      </ion-col>
      <ion-col size = '3'>
        {{item.Pick_and_drop}}
      </ion-col>
    </ion-row> -->
  </ion-grid>

</ion-content>
