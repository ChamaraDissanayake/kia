<ion-header>
  <ion-toolbar style="--background: #0f0f0f;">
    <ion-buttons slot="start">
      <ion-back-button style="color: white;" defaultHref="/damage-estimate"></ion-back-button>
    </ion-buttons>
    <ion-title>
      <img src="../../assets/Kia White Logo (no BG).png" style="width: 33%; margin-left: 25%;">
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="background-image" fullscreen="true">
  <div class="loader" *ngIf="showLoader">
    <ion-label>Uploading</ion-label><br>
    <ion-spinner name="dots"></ion-spinner>
  </div>
  <form [formGroup]="collitionForm" (ngSubmit)="submitDetails()" style="margin: 20px;">
    <div>
      <ion-label class="topics">Message</ion-label>
      <ion-item style="border-radius: 24px; padding: 5px;">
        <ion-textarea style="min-height: 86px;" auto-grow=true placeholder="Write a note" formControlName="description"></ion-textarea>
      </ion-item>
      <div class="validation-errors">
        <ng-container *ngFor="let validation of validation_messages.description">
          <div class="error-message"
            *ngIf="collitionForm.get('description').hasError(validation.type) && (collitionForm.get('description').dirty || collitionForm.get('description').touched)">
            {{ validation.message }}
          </div>
        </ng-container>
      </div>
    </div>

    <div style="margin-top: 20px;">
      <tr class="row" style="place-items: center">
        <td class="col-6">
          <ion-label class="topics">Upload image</ion-label>
        </td>
        <td class="col-5">
          <ion-button class="btn-edit" (click)="getImages()">Choose image</ion-button>
        </td>
        <td class="col-1"></td>
      </tr>
      <tr>
        <ion-label class="message" *ngIf="imageURLs.length>0">* Select image to delete</ion-label>
      </tr>

      <tr style="background: rgba(0, 0, 0, 0.5);">
        <span *ngFor="let image of imageURLs; let i = index">
          <img class="thumbnail" [src]='image' (click)="deleteImage(i)">
        </span>
      </tr>
    </div>
  
    <div style="margin-top: 20px;">
      <tr class="row" style="place-items: center">
        <td class="col-6">
          <ion-label class="topics">Upload video</ion-label>
        </td>
        <td class="col-5">
          <ion-button class="btn-edit" (click)="selectVideo()">Choose video</ion-button>
        </td>
        <td class="col-1"></td>
      </tr>
      <tr class="row" style="place-items: center" *ngIf="videoURLs.length>0">
        <td class="col-6">
        </td>
        <td class="col-6">
          <span class="video-count">
            {{videoURLs.length}} videos added
          </span>
        </td>
      </tr>
    </div>

    <div style="margin-top: 20px;">
      <tr class="row" style="place-items: center">
        <td class="col-6">
          <ion-label class="topics">Select vehicle</ion-label>
        </td>
        <td class="col-5">
          <ion-item style="width: 96%;" class="selector-wrapper">
            <ion-select placeholder="insurance" okText="Confirm" cancelText="Dismiss" (ionChange)="selectVehicle($event)">
              <ion-select-option *ngFor="let item of profile.vehicles" value="{{item.vehicle_id}}">{{item.vehicle_no}}</ion-select-option>
            </ion-select>
          </ion-item>
        </td>
        <td class="col-1"></td>
      </tr>
    </div>

    <div style="margin-top: 20px;">
      <tr class="row" style="place-items: center">
        <td class="col-6">
          <ion-label class="topics">Select insurance</ion-label>
        </td>
        <td class="col-5">
          <ion-item style="width: 96%;" class="selector-wrapper">
            <ion-select placeholder="insurance" okText="Confirm" cancelText="Dismiss" (ionChange)="selectInsurance($event)">
              <ion-select-option *ngFor="let item of insurance" value="{{item.insurance_id}}">{{item.insurance_name}}</ion-select-option>
            </ion-select>
          </ion-item>
        </td>
        <td class="col-1"></td>
      </tr>
    </div>

    <div style="width: 100%; margin-top: 20px; text-align: center;">
      <ion-button class="btnNavigate" type="Submit" [disabled]="!collitionForm.valid || !isValid || showLoader || isSubmitted">Submit</ion-button>
    </div>
  </form>
</ion-content>
