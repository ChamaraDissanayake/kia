<ion-header>
  <ion-toolbar style="--background: #0f0f0f; border-bottom: 3px solid white;">
    <ion-buttons slot="start">
      <ion-back-button style="color: white;" defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>
      <img src="../../assets/Kia White Logo (no BG).png" style="width: 33%; margin-left: 25%;">
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="background-image" fullscreen="true">
  <ion-segment class="segment" [(ngModel)]="accessoriesSwitch" color="primary">
    <ion-segment-button class="segment-button" value="orders">
      My orders
    </ion-segment-button>
    <ion-segment-button class="segment-button" value="accessories">
      Accessories
    </ion-segment-button>
  </ion-segment>

  <div [ngSwitch]="accessoriesSwitch">
    <div *ngSwitchCase="'orders'">
      <div class="my-orders" *ngFor="let item of myOrders">
        <!-- <div>
          <img class="thumbnail" [src]='item.image'>
        </div> -->
        <div style="margin: 10px 0px 10px 10px;">
          <ion-label class="topics">Name: {{item.name}}</ion-label>
        </div>
        <div style="margin: 10px 0px 10px 10px;">
          <ion-label class="topics">Description: {{item.description}}</ion-label>
        </div>
      </div>
    
      <div style="width: 100%; margin: 20px 0; text-align: center;">
        <ion-button class="btnNavigate" [routerLink]="['/accessories']">Back</ion-button>
      </div>
    </div>


    <div *ngSwitchCase="'accessories'">
      <div style="text-align: -webkit-center;">
        <h2>Select vehicle modal</h2>
        <ion-item class="selector-wrapper">
          <ion-select placeholder="Select model" okText="Confirm" cancelText="Dismiss"
            (ionChange)="selectModel($event)">
            <ion-select-option *ngFor="let item of vehicleModels" value="{{item.vehicle_model_id}}">{{item.model_name}}
            </ion-select-option>
          </ion-select>
        </ion-item>

        <ion-grid>
          <ion-row>
            <ion-col size="6" *ngFor="let item of accessories">
              <ion-card>
                <img [src]="item.image">
                <ion-label>{{item.name}}</ion-label><br>
                <ion-button (click)="gotoViewAccossory(item.accessory_id)" class="btn-edit" style="height: 28px;">View</ion-button>
              </ion-card>
            </ion-col>
          </ion-row>
        </ion-grid>
      </div>

    </div>
  </div>

  
</ion-content>
