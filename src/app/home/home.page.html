  <div style="padding: unset;">
    <ion-card style="margin: unset;">
      <ion-card-content style="padding: unset;">
        <video *ngFor="let item of mainVideo" controls loop #player1 playinline preload="auto" poster="{{item.thumbnail}}">          
          <source [src]="item.src" type="video/mp4">
        </video>        
      </ion-card-content>
    </ion-card>
  </div>

  <div>
    <ion-slides pager="false" [options]="slideOptsPromo">
      <ion-slide *ngFor="let item of sliderPromotion">
        <img [src]="item" style="background: white;" alt="KIA MOTORS">
      </ion-slide>
    </ion-slides>
  </div>

  <ion-grid class="no-padding">
    <ion-row>
      <ion-col class="no-padding" (click)="changeSlider('option1')">
        <img src="../../assets/kia-suv-slider.jpg" alt="KIA" *ngIf="activeSlider=='suv'">
        <img src="../../assets/kia-suv-slider-inactive.jpg" alt="KIA"  *ngIf="activeSlider!='suv'">
      </ion-col>
      <ion-col class="no-padding" (click)="changeSlider('option2')">
        <img src="../../assets/kia-car-slider.png" alt="KIA" *ngIf="activeSlider=='car'">
        <img src="../../assets/kia-car-slider-inactive.png" alt="KIA" *ngIf="activeSlider!='car'">
      </ion-col>
      <ion-col class="no-padding" (click)="changeSlider('option3')">
        <img src="../../assets/kia-commercial-slider.png" alt="KIA" *ngIf="activeSlider=='lorry'">
        <img src="../../assets/kia-commercial-slider-inactive.png" alt="KIA" *ngIf="activeSlider!='lorry'">
      </ion-col>
    </ion-row>
  </ion-grid>

  
  <div>
    <ion-slides pager="true" [options]="slideOpts" *ngIf="sliderChange">
      <ion-slide *ngFor="let item of kiaSlider" (click)="gotoSelectedVehicle(item.showcase_id)">
        <div style="width: 100%; position:absolute; z-index: 2; top:20px;">
          <div style="text-align: right;">
            <img style="width: 36%;" src="../../assets/kia-explore-button.PNG" alt="footer">
          </div>
        </div>
        <img [src]="item.src" style="background: white;" alt="KIA MOTORS">
      </ion-slide>

    </ion-slides>
    <ion-slides pager="true" [options]="slideOpts" *ngIf="!sliderChange">
      <ion-slide *ngFor="let item of kiaSlider" (click)="gotoSelectedVehicle(item.showcase_id)">
        <div style="width: 100%; position:absolute; z-index: 2; top:20px;">
          <div style="text-align: right;">
            <img style="width: 36%;" src="../../assets/kia-explore-button.PNG" alt="footer">
          </div>
        </div>
        <img [src]="item.src" style="background: white;" alt="KIA MOTORS">
      </ion-slide>
    </ion-slides>
  </div>
