<!-- swipeGesture='false' -->
<ion-app>
  <ion-menu menuId="main-menu" content-id='main'>
    <ion-header>
      <ion-toolbar style="--background: black; border-bottom: 3px solid white;">
        <ion-menu-toggle>
          <div (click)="gotoLogin()" *ngIf='kiaProviderService.permissionLevel==0'>
            <img src="../../assets/Kia White Logo (no BG).png" style="width: 26%; margin-left: 20px;" alt="KIA MOTORS">
            <ion-title class="text-white" style="float: right;">Sign In / Sign Up</ion-title>
          </div>
          <div (click)="gotoMyProfile()" *ngIf='kiaProviderService.permissionLevel!=0'>
            <img src="../../assets/Kia White Logo (no BG).png" style="width: 26%; margin-left: 20px;" alt="KIA MOTORS">
            <ion-title class="text-white" style="float: right;">My profile</ion-title>
          </div>
        </ion-menu-toggle>
      </ion-toolbar>
    </ion-header>
    <ion-content class="gradientBackground">
      <ion-list style="background:transparent;">
        <ion-menu-toggle>
          <ion-item (click)="gotoSelectedVehicle()">
            <ion-icon style="color: white;" name="home-outline" slot="start"></ion-icon>
            <ion-label class="text-white">Showcase</ion-label>
          </ion-item>
          <ion-item (click)="goToShowroom()">
            <ion-icon style="color: white;" name="car-outline" slot="start"></ion-icon>
            <ion-label class="text-white">Test drive</ion-label>
          </ion-item>
          <ion-item (click)="getoServices(2)" [disabled]='kiaProviderService.permissionLevel!=2'>
            <ion-icon style="color: white;" name="hammer-outline" slot="start"></ion-icon>
            <ion-label class="text-white">Service and maintenance</ion-label>
          </ion-item>
          <ion-item (click)="getoServices(3)" [disabled]='kiaProviderService.permissionLevel!=2'>
            <ion-icon style="color: white;" name="car-sport-outline" slot="start"></ion-icon>
            <ion-label class="text-white">Body shop</ion-label>
          </ion-item>
          <ion-item (click)="getoServices(4)" [disabled]='kiaProviderService.permissionLevel!=2'>
            <ion-icon style="color: white;" name="car-outline" slot="start"></ion-icon>
            <ion-label class="text-white">Work shop</ion-label>
          </ion-item>
          <ion-item (click)="getoServices(5)" [disabled]='kiaProviderService.permissionLevel!=2'>
            <ion-icon style="color: white;" name="build-outline" slot="start"></ion-icon>
            <ion-label class="text-white">Emergency breakdown</ion-label>
          </ion-item>
          <ion-item (click)="getoDamageEstimate()" [disabled]='kiaProviderService.permissionLevel!=2'>
            <ion-icon style="color: white;" name="bonfire-outline" slot="start"></ion-icon>
            <ion-label class="text-white">Damage estimate</ion-label>
          </ion-item>
          <ion-item [disabled]='kiaProviderService.permissionLevel!=2' (click)="goToMyBookings()">
            <ion-icon style="color: white;" name="book-outline" slot="start"></ion-icon>
            <ion-label class="text-white">My bookings</ion-label>
          </ion-item>
          <ion-item [disabled]='kiaProviderService.permissionLevel!=2'>
            <ion-icon style="color: white;" name="card-outline" slot="start"></ion-icon>
            <ion-label class="text-white">Account balances</ion-label>
          </ion-item>
          <ion-item (click)="gotoShowroomList()">
            <ion-icon style="color: white;" name="locate" slot="start"></ion-icon>
            <ion-label class="text-white">Find us</ion-label>
          </ion-item>
          <ion-item>
            <ion-icon style="color: white;" name="information-circle-outline" slot="start"></ion-icon>
            <ion-label class="text-white">About app</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>
  <ion-router-outlet id="main"></ion-router-outlet>
</ion-app>
