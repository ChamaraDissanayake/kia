<ion-header>
  <ion-toolbar style="--background: #0f0f0f; border-bottom: 3px solid white;">
    <ion-buttons slot="start">
      <ion-back-button style="color: white;" defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>
      <img src="../../assets/Kia White Logo (no BG).png" style="width: 33%; margin-left: 25%;">
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="background-image" fullscreen="true">
  <h1 style="text-align: center;">Damage estimate requests</h1>
  <div *ngFor="let item of estimateRequest" class="booking-container text-white">
    <tr class="row">
      <td class="col-8">
        <ion-label>{{item.description}}</ion-label>
      </td>
      <td class="col-4">
        <ion-button class="btn-edit" (click)="gotoView(false)" *ngIf="item.status==4">View</ion-button>
        <ion-button class="btn-edit" (click)="gotoRespond()" *ngIf="item.status==2">Respond</ion-button>
        <ion-button class="btn-edit" (click)="gotoView(true)" *ngIf="item.status==1 || item.status==3">Pending</ion-button>
      </td>
    </tr>
  </div>

  <ion-fab slot="fixed" vertical="bottom" horizontal="center">
    <ion-fab-button class="enabled" [routerLink]="['/damage-image-upload']">Create</ion-fab-button>
  </ion-fab>
</ion-content>
