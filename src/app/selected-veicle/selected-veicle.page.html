</ion-header>

<!-- <ion-content [scrollEvents]="true" (ionScroll)="didScroll()" fullscreen="true" style="--background: #0f0f0f;"> -->
<ion-content fullscreen="true" style="--background: #0f0f0f;">
  <!-- <div style="width: 100%; height: 3px; background: rgb(235, 0, 41);" slot="fixed"></div> -->
  <ion-fab slot="fixed" vertical="bottom" horizontal="center">
    <ion-fab-button class="enabled" [routerLink]="['/showroom']">Test<br>drive</ion-fab-button>
  </ion-fab>

  <div style="padding: unset;">
    <ion-card *ngFor="let item of feed; let i = index" style="margin: unset;" (click)="playVideo(i)">
      <ion-card-content style="padding: unset;">
        <video #player playinline preload="auto" poster="../../assets/kia-video-thumbnail.jpeg">
          <source [src]="item.src" type="video/mp4" [id]="i">
        </video>

        <ion-label class="lbl-on-video">{{ item.title }}</ion-label>
        <img #playImage [id]="i" class="lbl-on-video image-on-video"
          [ngClass]="{'btnHide': i == videoId && !videoPaused}" src="../../assets/kia-play-icon.png">
      </ion-card-content>
    </ion-card>
  </div>
  <!-- "src": "http://static.videogular.com/assets/videos/elephants-dream.mp4" -->
  <!-- <div>
    <img src="../../assets/kia-video-thumbnail-1.png">
  </div>
  <div>
    <img src="../../assets/kia-video-thumbnail-2.png">
  </div> -->
  <!-- <div>
    <img src="../../assets/kia-360VR.png" alt="360 IMAGE">
  </div> -->
  <div style="background: white;">
    <div class="text-360">
      360VR
    </div>
    <div class="vrContainer">
      <!-- <div class="col-2" style="padding-left: 20px; padding-right: 0px; padding-top: 20px;">
        <span (click)="slideNext()">
          <img src="../../assets/kia-left-rotate-vr.png">
        </span>
      </div> -->
      <div *ngIf="changeSlider">
        <ion-slides #slides slidesPerView="1" [options]="slideOpts">
          <!-- <ion-slides #slides slidesPerView="1" [options]="slideOpts" class="swiper-no-swiping"> -->
          <ion-slide *ngFor="let img of vrImages">
            <img [src]="img" alt="KIA" style="min-height: 100px;">
          </ion-slide>
        </ion-slides>
      </div>
      <div *ngIf="!changeSlider">
        <ion-slides #slides slidesPerView="1" [options]="slideOpts">
          <!-- <ion-slides #slides slidesPerView="1" [options]="slideOpts" class="swiper-no-swiping"> -->
          <ion-slide *ngFor="let img of vrImages">
            <img [src]="img" alt="KIA" style="min-height: 100px;">
          </ion-slide>
        </ion-slides>
      </div>
    </div>
    <div style="text-align: center;">
      <img src="../../assets/kia-360-rotate-text.png" alt="Drag to rotate">
    </div>
    <div style="text-align: center; padding-bottom: 10px;">

      <div>
        <ion-label>{{colorName}}</ion-label>
      </div>

      <span *ngFor="let item of vrImagesList">
        <!-- <ion-button class="custom-button" style="--background: rgb(243, 242, 239); width: 30px; height: 30px;" (click)="changeColor(0)"></ion-button>
        <ion-button class="custom-button" style="--background: olive; width: 30px; height: 30px;" (click)="changeColor(1)"></ion-button> -->
        <ion-button class="custom-button" [style.--background]="item.colorCode" (click)="changeColor(item)"></ion-button>
      </span>
    </div>
  </div>

  <div>
    <ion-grid>
      <ion-row>
        <ion-col style="padding: unset;" size="6" *ngFor="let item of images">
          <div class="image-container" [style.background-image]="'url('+item.src+')'">
            <!-- <img [src]="'url('+item.src+')'" alt="Kia"> -->
            <ion-label class="lbl-on-image" style="left: 0;">{{item.title}}</ion-label>
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>

    <ion-button class="btn-brochure" style="text-transform: none; margin-top:15px" (click)="downloadPdf()">Download brochure</ion-button>
  </div>

</ion-content>

</ion-footer> -->
